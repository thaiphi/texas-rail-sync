apiVersion: 1

groups:
  - orgId: 1
    name: explorer-collect
    folder: Explorer
    interval: 10s
    rules:
      - uid: explorer-collect-failed
        title: Explorer collection failed
        condition: C
        data:
          # A: failed collections that are new in the last 5 minutes. Each process is its own series (service.instance.id
          # becomes the instance label). Per series: the rise over 5 minutes, or the whole value of a series that did not
          # exist 5 minutes ago (plain increase() misses a brand-new series). Summed, so the rule has one alert instance.
          # Empty result means no new failure.
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              datasource:
                type: prometheus
                uid: prometheus
              expr: 'sum((rrc_collect_runs_total{outcome="failed"} - rrc_collect_runs_total{outcome="failed"} offset 5m) > 0 or (rrc_collect_runs_total{outcome="failed"} unless rrc_collect_runs_total{outcome="failed"} offset 5m))'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: reduce
              expression: A
              reducer: last
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              datasource:
                type: __expr__
                uid: __expr__
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
              intervalMs: 1000
              maxDataPoints: 43200
        dashboardUid: explorer-collect
        noDataState: OK      # no new failure returns an empty vector, which is healthy
        execErrState: Error
        for: 30s
        labels:
          service: explorer
          journey: collect
        # ZC-06: simplified routing sends this rule, and only this rule, to the local responder. The first POST comes about
        # 5 s after the rule fires; the resolved one within 30 s of recovery; a still-firing alert is resent after 1 h.
        notification_settings:
          receiver: explorer-responder
          group_wait: 5s
          group_interval: 30s
          repeat_interval: 1h
        annotations:
          summary: An Explorer well collection failed in the last 5 minutes (outcome=failed; rejected requests are not counted).
          runbook_url: https://github.com/thaiphi/texas-rail-sync/blob/main/README.md#on-call
          dashboard_url: http://127.0.0.1:3000/d/explorer-collect

# ZC-06: the local on-call responder (scripts/alert-receiver.mjs, port 8001 on the host). Grafana runs in a container,
# so it reaches the host as host.docker.internal (built into Docker Desktop; compose.yaml maps it on Linux).
# $ALERT_WEBHOOK_TOKEN comes from compose.yaml (Grafana expands environment variables in provisioning files).
contactPoints:
  - orgId: 1
    name: explorer-responder
    receivers:
      - uid: explorer-responder-webhook
        type: webhook
        disableResolveMessage: false
        settings:
          url: http://host.docker.internal:8001/alerts
          httpMethod: POST
          authorization_scheme: Bearer
          authorization_credentials: $ALERT_WEBHOOK_TOKEN
