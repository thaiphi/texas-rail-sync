# Runs the full test suite on every pull request (ZC-03, issue #39). No live RRC request is made.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: explorer
          POSTGRES_PASSWORD: explorer-ci-only
          POSTGRES_DB: explorer
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U explorer -d explorer"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # Turns on the real-Postgres round trip in test/run-index.test.mjs.
      DATABASE_URL: postgres://explorer:explorer-ci-only@127.0.0.1:5432/explorer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install from the lockfile
        run: npm ci

      - name: Explorer suite (node --test), including the real-Postgres test
        run: npm test

      - name: UI suite (vitest)
        run: npm run test:ui
