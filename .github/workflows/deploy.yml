# PROBE (ZC-04, issue #40): learn what a local Supabase replica can run. Replaced before merge.
name: deploy

on:
  push:
    branches: [zc-04/staging]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase --version
      - name: Start the replica (database, API gateway and Edge runtime only)
        run: supabase start -x studio,mailpit,imgproxy,realtime,logflare,vector,supavisor,storage-api,postgres-meta
      - name: Key and URL names the replica offers
        run: supabase status -o env | sed -E 's/=.*/=<redacted>/'
      - name: Key prefixes
        run: supabase status -o json | jq -r 'to_entries[]|"\(.key) \(.value|tostring|.[0:12])"'
      - name: Archive SQL applies on the replica
        run: |
          db=$(supabase status -o json | jq -r .DB_URL)
          psql "$db" -v ON_ERROR_STOP=1 -f docs/sql/trrc-archive.sql
          psql "$db" -v ON_ERROR_STOP=1 -f docs/sql/trrc-archive-rpc-proposed.sql
          psql "$db" -c '\dn'
      - name: Serve the function
        run: |
          supabase functions serve trrc-explorer --no-verify-jwt > serve.log 2>&1 &
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:54321/functions/v1/trrc-explorer/api/versions && break; sleep 2; done
          for p in "POST /api/collect" "PUT /api/versions" "GET /api/versions" "GET /api/guest/session"; do
            set -- $p; echo "== $1 $2"; curl -s -X $1 -w ' -> %{http_code}\n' http://127.0.0.1:54321/functions/v1/trrc-explorer$2; done
          sleep 2; cat serve.log
